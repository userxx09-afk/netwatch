name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      export_method:
        description: "How the .ipa will be distributed"
        type: choice
        options: [ad-hoc, enterprise, app-store]
        default: ad-hoc

jobs:
  # Proves the code compiles. Needs no Apple account or secrets.
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project NetWatch.xcodeproj -scheme NetWatch -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -100 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

  # Signed .ipa you can upload to your MDM. Run manually: Actions -> iOS build -> Run workflow.
  signed:
    needs: compile
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      TEAM_ID: ${{ vars.TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY || 'Apple Distribution' }}
      EXPORT_METHOD: ${{ inputs.export_method }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing setup
        run: |
          missing=""
          for v in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD TEAM_ID BUNDLE_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets/variables:$missing (see README, 'Build on GitHub')"
            exit 1
          fi

      - name: Install certificate and provisioning profile
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Using profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Write signing config
        run: |
          cat > Config/Signing.local.xcconfig <<XC
          PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = $SIGNING_IDENTITY
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          CURRENT_PROJECT_VERSION = ${{ github.run_number }}
          XC

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project NetWatch.xcodeproj -scheme NetWatch -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NetWatch.xcarchive" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            archive 2>&1 | tee archive.log

      - name: Export .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGNING_IDENTITY</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NetWatch.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: NetWatch-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
